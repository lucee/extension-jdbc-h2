name: Publish legacy 1.3.172 to Maven Central

# One-off re-publication of the existing H2 extension 1.3.172 (.lex built 2015-02-26) to Maven Central,
# so Lucee 7+ resolves it from Central instead of cdn.lucee.org.
# Nothing is rebuilt: the exact file from cdn.lucee.org is downloaded, checked against the pinned
# size/SHA-256/MD5 below, then attached, signed and published with the same plugins and secrets as main.yml.
#
# - pull_request: dry run only (download, verify, build the bundle; no signing, no upload, no secrets)
# - push to master / workflow_dispatch: publish, unless 1.3.172 is already on Central

on:
  pull_request:
    paths:
      - 'legacy/1.3.172/**'
      - '.github/workflows/publish-legacy-1.3.172.yml'
  push:
    branches: [master]
    paths:
      - 'legacy/1.3.172/**'
      - '.github/workflows/publish-legacy-1.3.172.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-legacy-1.3.172
  cancel-in-progress: false

env:
  DIR: legacy/1.3.172
  LEX_NAME: h2-jdbc-extension-1.3.172.lex
  LEX_URL: https://cdn.lucee.org/org/lucee/h2-jdbc-extension/1.3.172/h2-jdbc-extension-1.3.172.lex
  LEX_SIZE: '1496769'
  LEX_MD5: ad63834be65cbee999cbb85a4dd49d5a
  LEX_SHA256: 7bed323accaf2461a64dcce541c90ff916e12b30581de2b22db48ec5b45e408e
  CENTRAL_DIR: https://repo1.maven.org/maven2/org/lucee/h2-jdbc-extension/1.3.172

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download the .lex from cdn.lucee.org and verify it
        run: |
          curl -fsSL --retry 3 -o "$DIR/$LEX_NAME" "$LEX_URL"
          size=$(stat -c %s "$DIR/$LEX_NAME")
          echo "size=$size"
          [ "$size" = "$LEX_SIZE" ] || { echo "::error::size mismatch ($size != $LEX_SIZE)"; exit 1; }
          echo "$LEX_SHA256  $DIR/$LEX_NAME" | sha256sum -c -
          echo "$LEX_MD5  $DIR/$LEX_NAME" | md5sum -c -

      - name: Check whether 1.3.172 is already on Maven Central
        id: central
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -I "$CENTRAL_DIR/$LEX_NAME")
          echo "HTTP $code for $CENTRAL_DIR/$LEX_NAME"
          if [ "$code" = "200" ]; then
            remote=$(curl -fsSL "$CENTRAL_DIR/$LEX_NAME" | sha256sum | cut -d' ' -f1)
            [ "$remote" = "$LEX_SHA256" ] || { echo "::error::Central copy differs from the cdn file ($remote)"; exit 1; }
            echo "Already on Central and identical, nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide
        id: mode
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
             && [ "${{ github.repository }}" = "lucee/extension-jdbc-h2" ] \
             && [ "${{ github.ref }}" = "refs/heads/master" ] \
             && [ "${{ steps.central.outputs.exists }}" != "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "mode: PUBLISH"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "mode: dry run"
          fi

      - name: Dry run (bundle only, unsigned, no upload)
        if: steps.mode.outputs.publish != 'true'
        env:
          MAVEN_USERNAME: dry-run
          MAVEN_PASSWORD: dry-run
        run: |
          mvn -B -e -f "$DIR/pom.xml" deploy -DskipPublishing=true --settings maven-settings.xml
          unzip -l "$DIR/target/central-publishing/central-bundle.zip"
          unzip -p "$DIR/target/central-publishing/central-bundle.zip" "org/lucee/h2-jdbc-extension/1.3.172/$LEX_NAME" \
            | sha256sum | grep -q "^$LEX_SHA256 " && echo "bundled .lex is byte-identical to the cdn file"

      - name: Import GPG key
        if: steps.mode.outputs.publish == 'true'
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Sign and publish to Maven Central
        if: steps.mode.outputs.publish == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B -e -f "$DIR/pom.xml" deploy -DperformRelease=true --settings maven-settings.xml

      - name: Check repo1.maven.org (informational; sync can take ~30 min)
        if: steps.mode.outputs.publish == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL -o /tmp/central.lex "$CENTRAL_DIR/$LEX_NAME"; then
              echo "$LEX_SHA256  /tmp/central.lex" | sha256sum -c - && exit 0
              echo "::error::Central copy differs from the cdn file"; exit 1
            fi
            sleep 30
          done
          echo "::warning::Not on repo1 yet; check $CENTRAL_DIR/ again later."
